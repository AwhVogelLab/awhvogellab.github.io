# Semantic Scholar author IDs for the lab's PIs.
# Find these by searching https://www.semanticscholar.org for the person,
# opening their profile, and copying the numeric ID from the URL, e.g.
# semanticscholar.org/author/Edward-Awh/2261234  ->  "2261234"
semantic_scholar_author_ids:
  awh_main: "2889676"
  awh_secondary: "2373054044"
  vogel_main: "39500842"
  vogel_secondary: "2250813190"

# Used for author-formatting heuristics (not load-bearing yet, but reserved
# in case we want to flag/bold lab-affiliated authors later).
lab_surnames:
  - Awh
  - Vogel

# Ignore anything older than this (keeps the scan fast and avoids dredging
# up decades-old papers that are already in the CSV under slightly
# different title formatting).
min_year: 1993

# One-off titles to always skip, for cases no automated rule can catch --
# e.g. a paper that was later retracted but whose own title gives no hint
# of that (the retraction notice itself gets caught automatically; the
# original paper does not). Match doesn't need to be exact -- it's compared
# after the same normalization used for de-duplication (case/punctuation-
# insensitive), so just paste the title as written.
manual_exclude_titles:
  - "The plateau in mnemonic resolution across large set sizes indicates discrete resource limits in visual working memory"

# Papers whose venue name contains any of these (case-insensitive) are
# treated as preprints, not finished papers, and get skipped. Conference-only
# entries (Semantic Scholar's publicationTypes == ["Conference"]) are skipped
# automatically regardless of this list. Uncomment/edit to add more:
# preprint_keywords:
#   - biorxiv
#   - medrxiv
#   - psyarxiv
#   - arxiv
#   - ssrn
#   - research square
#   - chemrxiv
#   - osf preprints
#   - preprints.org
